<style>
  :root {
    color-scheme: light;
    --admin-bg: #f3f5f4;
    --admin-surface: #ffffff;
    --admin-surface-soft: #f8faf9;
    --admin-text: #17211c;
    --admin-muted: #65716a;
    --admin-line: #d9dfdc;
    --admin-accent: #17663f;
    --admin-accent-soft: #e1f1e8;
    --admin-warning: #8a5a00;
    --admin-danger: #b42318;
    --admin-danger-soft: #fee9e7;
    --admin-focus: #267ac9;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    background: var(--admin-bg);
    color: var(--admin-text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  a {
    color: inherit;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--admin-focus) 45%, transparent);
    outline-offset: 2px;
  }

  .admin-page {
    width: min(1440px, 100%);
    margin: 0 auto;
    padding: 24px clamp(16px, 3vw, 42px) 64px;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--admin-line);
  }

  .admin-header h1 {
    margin: 3px 0 0;
    font-size: clamp(1.75rem, 3vw, 2.35rem);
    font-weight: 650;
    letter-spacing: 0;
    line-height: 1.1;
  }

  .admin-kicker,
  .muted,
  .field-help {
    color: var(--admin-muted);
  }

  .admin-kicker {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .admin-actions,
  .card-actions,
  .order-actions,
  .dialog-actions,
  .bulk-bar__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .button,
  button {
    display: inline-flex;
    min-height: 38px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 13px;
    border: 1px solid var(--admin-text);
    border-radius: 6px;
    background: var(--admin-text);
    color: #ffffff;
    cursor: pointer;
    font-weight: 650;
    font-size: 0.82rem;
    line-height: 1.2;
    text-decoration: none;
  }

  .button:hover,
  button:hover {
    filter: brightness(1.08);
  }

  button:disabled {
    cursor: not-allowed;
    filter: none;
    opacity: 0.45;
  }

  .button--accent {
    border-color: var(--admin-accent);
    background: var(--admin-accent);
  }

  .button--ghost,
  .order-actions button {
    border-color: var(--admin-line);
    background: var(--admin-surface);
    color: var(--admin-text);
  }

  .button--danger {
    border-color: #efb2ad;
    background: var(--admin-surface);
    color: var(--admin-danger);
  }

  .button--danger-filled {
    border-color: var(--admin-danger);
    background: var(--admin-danger);
    color: #ffffff;
  }

  .panel {
    padding: clamp(18px, 3vw, 28px);
    border: 1px solid var(--admin-line);
    border-radius: 8px;
    background: var(--admin-surface);
  }

  .field {
    display: grid;
    gap: 8px;
    margin-bottom: 18px;
  }

  .field label,
  .field-label {
    font-size: 0.76rem;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--admin-line);
    border-radius: 6px;
    background: var(--admin-surface);
    color: inherit;
    padding: 10px 11px;
  }

  textarea {
    min-height: 110px;
    resize: vertical;
  }

  input[type="file"] {
    background: var(--admin-surface-soft);
  }

  input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--admin-accent);
  }

  .checkbox-field {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 18px;
  }

  .checkbox-field label {
    display: grid;
    gap: 3px;
    font-size: 0.9rem;
    line-height: 1.35;
  }

  .errorlist,
  .message-list {
    margin: 0 0 18px;
    padding: 0;
    list-style: none;
  }

  .errorlist li,
  .message-list li {
    padding: 11px 13px;
    border: 1px solid transparent;
    border-radius: 6px;
  }

  .errorlist li {
    border-color: #efb2ad;
    background: var(--admin-danger-soft);
    color: var(--admin-danger);
  }

  .message-list li {
    border-color: #b7d9c7;
    background: var(--admin-accent-soft);
    color: #124b31;
  }

  .message-list li.error {
    border-color: #efb2ad;
    background: var(--admin-danger-soft);
    color: var(--admin-danger);
  }

  .manager-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 26px;
    align-items: start;
  }

  .folder-nav {
    position: sticky;
    top: 18px;
  }

  .folder-nav__heading,
  .gallery-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .folder-nav__heading h2,
  .gallery-heading h2 {
    margin: 0;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .gallery-heading p {
    margin: 0;
    color: var(--admin-muted);
    font-size: 0.82rem;
  }

  .folder-list {
    display: grid;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .folder-list a {
    display: flex;
    min-height: 40px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 10px;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--admin-muted);
    font-size: 0.88rem;
    text-decoration: none;
  }

  .folder-list a:hover {
    border-color: var(--admin-line);
    background: var(--admin-surface);
    color: var(--admin-text);
  }

  .folder-list a[aria-current="page"] {
    border-color: #b7d9c7;
    background: var(--admin-accent-soft);
    color: #124b31;
    font-weight: 700;
  }

  .folder-count {
    min-width: 22px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .gallery-column {
    min-width: 0;
  }

  .bulk-bar {
    position: sticky;
    z-index: 10;
    top: 12px;
    display: flex;
    min-height: 58px;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
    padding: 9px 10px 9px 14px;
    border: 1px solid #2c3a33;
    border-radius: 8px;
    background: #17211c;
    color: #ffffff;
    box-shadow: 0 10px 24px rgba(23, 33, 28, 0.16);
  }

  .bulk-bar__selection {
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }

  .bulk-bar .button--ghost {
    border-color: #56635d;
    background: #25312b;
    color: #ffffff;
  }

  .bulk-bar .button--danger {
    border-color: #8f4b45;
    background: #3a211f;
    color: #ffd4cf;
  }

  .select-all-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    font-weight: 650;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
    gap: 14px;
  }

  .photo-card {
    position: relative;
    display: flex;
    min-width: 0;
    min-height: 100%;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--admin-line);
    border-radius: 8px;
    background: var(--admin-surface);
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }

  .photo-card.is-selected {
    border-color: var(--admin-accent);
    box-shadow: 0 0 0 2px var(--admin-accent);
  }

  .photo-card__image {
    display: block;
    overflow: hidden;
    background: #dfe4e1;
  }

  .photo-card img,
  .edit-preview img {
    display: block;
    width: 100%;
    background: #dfe4e1;
    object-fit: cover;
  }

  .photo-card img {
    aspect-ratio: 4 / 3;
    transition: transform 180ms ease;
  }

  .photo-card__image:hover img {
    transform: scale(1.02);
  }

  .photo-select {
    position: absolute;
    z-index: 2;
    top: 10px;
    left: 10px;
    display: grid;
    width: 36px;
    height: 36px;
    place-items: center;
    border: 1px solid rgba(23, 33, 28, 0.22);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 2px 8px rgba(23, 33, 28, 0.12);
  }

  .photo-card__body {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 12px;
    padding: 14px;
  }

  .photo-card h3,
  .edit-details h2 {
    margin: 0;
    font-size: 1rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  .photo-card p {
    margin: 0;
    line-height: 1.45;
  }

  .photo-description {
    display: -webkit-box;
    overflow: hidden;
    color: #39443e;
    font-size: 0.86rem;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .camera-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }

  .camera-stat {
    min-width: 0;
    padding: 8px;
    border: 1px solid var(--admin-line);
    border-radius: 6px;
    background: var(--admin-surface-soft);
  }

  .camera-stat span {
    display: block;
    color: var(--admin-muted);
    font-size: 0.58rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .camera-stat strong {
    display: block;
    margin-top: 4px;
    overflow-wrap: anywhere;
    font-size: 0.9rem;
  }

  .card-actions {
    margin-top: auto;
    padding-top: 2px;
  }

  .card-actions .button,
  .card-actions button,
  .order-actions button {
    min-height: 34px;
    padding: 7px 10px;
    font-size: 0.76rem;
  }

  .order-actions {
    padding-top: 10px;
    border-top: 1px solid var(--admin-line);
  }

  .inline-form {
    display: inline;
    margin: 0;
  }

  .empty-state {
    grid-column: 1 / -1;
    min-height: 220px;
    display: grid;
    place-items: center;
    text-align: center;
  }

  .empty-state h2 {
    margin: 0 0 6px;
    font-size: 1.15rem;
  }

  .empty-state p {
    margin: 0 0 18px;
  }

  dialog {
    width: min(520px, calc(100% - 28px));
    max-height: calc(100vh - 40px);
    padding: 0;
    overflow: auto;
    border: 1px solid var(--admin-line);
    border-radius: 8px;
    background: var(--admin-surface);
    color: var(--admin-text);
    box-shadow: 0 24px 64px rgba(23, 33, 28, 0.24);
  }

  dialog::backdrop {
    background: rgba(16, 24, 20, 0.52);
  }

  .dialog-header,
  .dialog-body,
  .dialog-footer {
    padding: 18px 20px;
  }

  .dialog-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--admin-line);
  }

  .dialog-header h2 {
    margin: 0;
    font-size: 1.15rem;
  }

  .dialog-header p {
    margin: 5px 0 0;
    color: var(--admin-muted);
    font-size: 0.86rem;
    line-height: 1.4;
  }

  .dialog-close {
    width: 34px;
    min-height: 34px;
    flex: 0 0 34px;
    padding: 0;
    border-color: var(--admin-line);
    background: var(--admin-surface);
    color: var(--admin-text);
    font-size: 1.2rem;
  }

  .dialog-footer {
    display: flex;
    justify-content: flex-end;
    border-top: 1px solid var(--admin-line);
    background: var(--admin-surface-soft);
  }

  .dialog-actions {
    justify-content: flex-end;
  }

  .edit-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(310px, 430px);
    gap: 22px;
    align-items: start;
  }

  .edit-preview {
    overflow: hidden;
    border-radius: 8px;
    background: #dfe4e1;
  }

  .edit-preview img {
    max-height: 720px;
    object-fit: contain;
  }

  .edit-details {
    display: grid;
    gap: 14px;
  }

  .form-layout {
    width: min(760px, 100%);
    margin: 0 auto;
  }

  .form-intro {
    margin: 0 0 22px;
    color: var(--admin-muted);
    line-height: 1.5;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 880px) {
    .manager-layout,
    .edit-layout {
      grid-template-columns: 1fr;
    }

    .folder-nav {
      position: static;
    }

    .folder-list {
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    }
  }

  @media (max-width: 620px) {
    .admin-page {
      padding-top: 16px;
    }

    .admin-header,
    .bulk-bar {
      align-items: stretch;
      flex-direction: column;
    }

    .admin-actions,
    .bulk-bar__actions {
      width: 100%;
    }

    .admin-actions .button,
    .bulk-bar__actions .button,
    .bulk-bar__actions button {
      flex: 1 1 auto;
    }

    .photo-grid {
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    }

    .bulk-bar {
      top: 8px;
    }
  }
</style>
